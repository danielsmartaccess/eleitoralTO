<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a3a6e" />
  <title>Administração — Pesquisa Eleitoral Tocantins 2026</title>
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="marca">
      <strong>FOCCUS PESQUISAS</strong>
      <span>Administração</span>
    </div>
    <div class="flex-entre" style="gap:0.6rem;">
      <div id="status-conexao" class="status-conexao">-</div>
      <button class="btn-texto" id="btn-sair-admin" style="color:#fff;">Sair</button>
    </div>
  </header>

  <nav class="abas">
    <a href="dashboard.html">Dashboard</a>
    <a href="relatorio.html">Relatório</a>
    <a href="admin.html" class="ativo">Administração</a>
  </nav>

  <main class="container">
    <section class="cartao">
      <div class="flex-entre">
        <h2 class="titulo-secao">Pesquisadores em campo</h2>
        <span class="texto-suave" id="contagem-pesquisadores"></span>
      </div>
      <div class="tabela-wrap">
        <table class="tabela-simples">
          <thead>
            <tr><th>Nome</th><th>Entrevistas coletadas</th><th>Hoje</th><th>Última coleta</th></tr>
          </thead>
          <tbody id="tabela-pesquisadores"></tbody>
        </table>
      </div>
    </section>

    <section class="cartao">
      <div class="flex-entre">
        <h2 class="titulo-secao">Entrevistas</h2>
        <button class="btn-texto" id="btn-exportar-csv">⬇ Exportar CSV</button>
      </div>
      <div class="tabela-wrap">
        <table class="tabela-simples">
          <thead>
            <tr><th>Código</th><th>Pesquisador</th><th>Município</th><th>Status</th><th>Duração</th><th>Coletada em</th></tr>
          </thead>
          <tbody id="tabela-entrevistas"></tbody>
        </table>
      </div>
      <div class="paginacao">
        <button class="btn-texto" id="btn-pagina-anterior">← Anterior</button>
        <span class="texto-suave" id="info-pagina"></span>
        <button class="btn-texto" id="btn-pagina-proxima">Próxima →</button>
      </div>
    </section>
  </main>

  <script type="module" src="config/supabase.js"></script>
  <script type="module" src="config/pesquisa.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
