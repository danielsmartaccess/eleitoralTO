<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a3a6e" />
  <title>Relatório — Pesquisa Eleitoral Tocantins 2026</title>
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="marca">
      <strong>FOCCUS PESQUISAS</strong>
      <span>Relatório</span>
    </div>
    <div class="flex-entre" style="gap:0.6rem;">
      <div id="status-conexao" class="status-conexao">-</div>
    </div>
  </header>

  <nav class="abas">
    <a href="dashboard.html">Dashboard</a>
    <a href="relatorio.html" class="ativo">Relatório</a>
  </nav>

  <main class="container">
    <section class="cartao">
      <div class="flex-entre" style="flex-wrap:wrap; gap:0.75rem;">
        <div>
          <h2 class="titulo-secao">Resumo</h2>
          <div id="resumo-executivo"><p class="texto-suave">Carregando...</p></div>
        </div>
        <select id="filtro-municipio" title="Município / pesquisa" aria-label="Município / pesquisa"></select>
      </div>
    </section>

    <div class="aviso-metodologico">
      Todos os percentuais abaixo são calculados sobre as entrevistas completas da pesquisa.
    </div>

    <section class="cartao" id="secao-blocos"></section>
  </main>

  <script type="module" src="config/supabase.js"></script>
  <script type="module" src="config/pesquisa.js"></script>
  <script type="module" src="js/relatorio.js"></script>
</body>
</html>
